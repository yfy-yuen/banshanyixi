  .cart-total { color: #f04f4f; font-size: 18px; font-weight: 600; }

    <div class="modal" id="editModal"></div>

  if (t && ROOMS[t]) { roomNo = t; roomName = ROOMS[t]; }
  renderRoomGrid();
  if (roomNo) { renderRoomSlot(); await loadDishes(); renderCustomer(); }
  else { $('roomMask').style.display = 'flex'; }
}
function renderRoomGrid() {
  $('roomGrid').innerHTML = Object.entries(ROOMS).map(([no, name]) =>
    `<div class="qr-card" style="cursor:pointer;" onclick="chooseRoom('${no}')"><div class="qn">${name}</div><div class="qt">${no} 号包厢</div></div>`
  ).join('');
}
async function chooseRoom(no) {
  roomNo = no; roomName = ROOMS[no];
  $('roomMask').style.display = 'none';
  renderRoomSlot();
  await loadDishes(); renderCustomer();
}
function closeRoom() { /* 不允许关闭，必须选包厢 */ }
function renderRoomSlot() {
  $('roomSlot').innerHTML = `<span class="room-tag">${roomName}</span> · ${roomNo} 号 · <a class="link-btn" onclick="setPeople()">${people} 人 ▾</a>`;
}
function setPeople() {
  const v = prompt('请选择用餐人数', people);
  if (v && Number(v) > 0) { people = Number(v); renderRoomSlot(); }
}

/* ===== 菜单（云端） ===== */
async function loadDishes() {
  const { data, error } = await db.from('dishes').select('*').order('price');
  if (error) { $('menu').innerHTML = '<div class="order-msg">菜单加载失败：' + error.message + '</div>'; return; }
  dishesCache = (data || []).filter(d => d.available !== false);
  renderCats(); renderMenu(); updateOrderBadge();
}
function renderCats() {
  const all = ['全部', ...CATS];
  $('catSidebar').innerHTML = all.map(c =>
    `<div class="cat-item ${c === curCat ? 'active' : ''}" onclick="setCat('${c}')"><span class="cat-dot" style="background:${c === curCat ? '#f04f4f' : '#bbb'}"></span>${c}</div>`
  ).join('');
}
function setCat(c) { curCat = c; renderCats(); renderMenu(); }
function renderMenu() {
  const list = dishesCache.filter(d => curCat === '全部' || d.category === curCat);
  if (!list.length) { $('menu').innerHTML = '<div class="card muted">该分类暂无菜品</div>'; return; }
  $('menu').innerHTML = `<div class="product-list">${list.map(d => {
    const addHandler = (d.specs && d.specs.length) ? `openSpec('${d.id}')` : `addSimple('${d.id}')`;
    return `<div class="product-item">
      <img class="product-img" src="${d.image || 'images/mifan.svg'}" alt="${d.name}" />
      <div class="product-info">
        <div>
          <div class="product-title">${d.name}</div>
          <div class="product-desc">${(d.specs && d.specs.length) ? '可选规格' : (d.description || '')}</div>
        </div>
        <div class="product-bottom">
          <span class="price-red">${fmt(d.price)}</span>
          <div class="step">
            <button onclick="decDish('${d.id}')">−</button>
            <span class="n">${dishQty(d.id)}</span>
            <button class="add-red" onclick="${addHandler}">+</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function dishQty(id) {
  return cart.filter(c => c.dishId === id).reduce((s, c) => s + c.qty, 0);
}

/* ===== 购物车（前端） ===== */
function addSimple(id) {
  const d = dishesCache.find(x => x.id === id); if (!d) return;
  cart.push({ key: uid(), dishId: id, name: d.name, basePrice: d.price, category: d.category, sel: {}, unitPrice: d.price, qty: 1 });
  renderMenu(); renderCart();
}
function decDish(id) {
  const idx = [...cart].reverse().findIndex(c => c.dishId === id);
  if (idx < 0) return;
  const realIdx = cart.length - 1 - idx;
  if (cart[realIdx].qty > 1) cart[realIdx].qty--; else cart.splice(realIdx, 1);
  renderMenu(); renderCart();
}
function renderCart() {
  let count = 0, total = 0;
  cart.forEach(c => { count += c.qty; total += c.unitPrice * c.qty; });
  const show = count > 0;
  $('cartbar').style.display = (show && custTab === 'menu') ? 'flex' : 'none';
  $('cartTotal').textContent = fmt(total);
  $('cartCountText').textContent = '共 ' + count + ' 件商品';
  const bag = $('bagBadge');
  if (count > 0) { bag.style.display = 'inline-block'; bag.textContent = count; } else bag.style.display = 'none';
  $('submitBtn').disabled = !show;
}

/* ===== 规格 ===== */
function openSpec(id) {
  const d = dishesCache.find(x => x.id === id); if (!d) return;
  specDraft = { dish: d, picked: {}, qty: 1 };
  (d.specs || []).forEach(g => { const first = g.options[0]; specDraft.picked[g.group] = first ? first.label : ''; });
  renderSpec();
  $('specMask').style.display = 'flex';
}
function pickSpec(group, label, delta) {
  specDraft.picked[group] = label;
  renderSpec();
}
function renderSpec() {
  const d = specDraft.dish;
  let total = d.price;
  (d.specs || []).forEach(g => {
    const opt = g.options.find(o => o.label === specDraft.picked[g.group]);
    if (opt) total += (opt.delta || 0);
  });
  total = total * specDraft.qty;
  $('specModal').innerHTML = `
    <h2>${d.name}</h2>
    ${(d.specs || []).map(g => `
      <div class="spec-group">
        <div class="g-name">${g.group}</div>
        <div class="spec-chips">
          ${g.options.map(o => `<span class="spec-chip ${specDraft.picked[g.group] === o.label ? 'on' : ''}" onclick="pickSpec('${g.group}','${o.label}',${o.delta || 0})">${o.label}${o.delta ? ' (+' + o.delta + ')' : ''}</span>`).join('')}
        </div>
      </div>`).join('')}
    <div class="spec-foot">
      <div class="qty-stepper">
        <button onclick="specQty(-1)">−</button><span>${specDraft.qty}</span><button onclick="specQty(1)">+</button>
      </div>
      <span class="spec-preview">${fmt(total)}</span>
    </div>
    <button class="btn" style="width:100%;margin-top:16px;" onclick="confirmSpec()">加入购物车</button>`;
}
function specQty(d) { specDraft.qty = Math.max(1, specDraft.qty + d); renderSpec(); }
function confirmSpec() {
  const d = specDraft.dish;
  let unit = d.price;
  const sel = {};
  (d.specs || []).forEach(g => { const opt = g.options.find(o => o.label === specDraft.picked[g.group]); sel[g.group] = specDraft.picked[g.group]; if (opt) unit += (opt.delta || 0); });
  for (let i = 0; i < specDraft.qty; i++)
    cart.push({ key: uid(), dishId: d.id, name: d.name, basePrice: d.price, category: d.category, sel, unitPrice: unit, qty: 1 });
  closeSpec(); renderMenu(); renderCart();
}
function closeSpec() { $('specMask').style.display = 'none'; specDraft = null; }

/* ===== 提交订单（云端） ===== */
async function submitOrder() {
  if (!roomNo) { alert('请先选择包厢'); return; }
  if (!cart.length) return;
  const items = cart.map(c => ({ name: c.name, unitPrice: c.unitPrice, qty: c.qty, sel: c.sel, category: c.category }));
  const total = items.reduce((s, i) => s + i.unitPrice * i.qty, 0);
  const oid = 'o_' + uid();
  const { error } = await db.from('orders').insert({
    id: oid, table_no: roomNo, room_name: roomName, people,
    items, total, status: 'unpaid', created_at: new Date().toISOString()
  });
  if (error) { alert('提交失败：' + error.message); return; }
  cart = []; renderMenu(); renderCart();
  showBill(oid, items, total);
  updateOrderBadge();
}
function showBill(oid, items, total) {
  $('billModal').innerHTML = `
    <h2>下单成功</h2>
    <div class="card">
      <div class="o-row"><b>包厢</b><span>${roomName}（${roomNo}号）</span></div>
      <div class="o-row"><b>人数</b><span>${people} 人</span></div>
      <div style="margin:10px 0;">${items.map(i => `<div class="o-row"><span>${i.name}${Object.keys(i.sel||{}).length ? '（' + Object.values(i.sel).join('/') + '）' : ''} ×${i.qty}</span><span>${fmt(i.unitPrice * i.qty)}</span></div>`).join('')}</div>
      <div class="o-row" style="border-top:1px solid #eee;padding-top:8px;"><b>合计</b><span class="price-red">${fmt(total)}</span></div>
    </div>
    <button class="btn" style="width:100%;" onclick="closeBill()">完成</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px;" onclick="switchCust('myorders');closeBill()">查看我的订单</button>`;
  $('billMask').style.display = 'flex';
}
function closeBill() { $('billMask').style.display = 'none'; }

/* ===== 我的订单（云端） ===== */
async function renderMyOrders() {
  const box = $('cust-orders');
  box.innerHTML = '<div class="loading">加载中…</div>';
  const { data, error } = await db.from('orders').select('*').eq('table_no', roomNo).order('created_at', { ascending: false });
  if (error) { box.innerHTML = '<div class="order-msg">加载失败：' + error.message + '</div>'; return; }
  const list = data || [];
  if (!list.length) { box.innerHTML = '<div class="card muted">本包厢还没有订单</div>'; return; }
  box.innerHTML = `<div class="section-title">我的订单（${roomName}）</div>` + list.map(o => {
    const its = o.items || [];
    const st = o.status === 'paid' ? '<span class="pill paid">已支付</span>' : '<span class="pill unpaid">未支付</span>';
    return `<div class="card">
      <div class="o-row"><b>订单 ${o.id.slice(-6)}</b>${st}</div>
      <div class="o-items">${its.map(i => `${i.name}${Object.keys(i.sel||{}).length ? '（' + Object.values(i.sel).join('/') + '）' : ''} ×${i.qty}`).join('，')}</div>
      <div class="o-row"><span class="muted">${new Date(o.created_at).toLocaleString('zh-CN')}</span><span class="price-red">${fmt(o.total)}</span></div>
    </div>`;
  }).join('');
}

/* ===== 底部角标 / 切换 ===== */
async function updateOrderBadge() {
  if (!roomNo) return;
  const { data } = await db.from('orders').select('*', { count: 'exact', head: true }).eq('table_no', roomNo);
  const n = (data && data.length) || 0;
  const b = $('orderBadge');
  if (n > 0) { b.style.display = 'inline-block'; b.textContent = n; } else b.style.display = 'none';
}
function switchCust(t) {
  custTab = t;
  $('btab-menu').classList.toggle('active', t === 'menu');
  $('btab-orders').classList.toggle('active', t === 'myorders');
  $('cust-menu').style.display = t === 'menu' ? 'flex' : 'none';
  $('cust-orders').style.display = t === 'myorders' ? 'block' : 'none';
  renderCart();
  if (t === 'myorders') renderMyOrders();
}

/* ===== 商家后台（云端鉴权） ===== */
function switchTab(t) {
  $('tab-customer').classList.toggle('active', t === 'customer');
  $('tab-merchant').classList.toggle('active', t === 'merchant');
  $('view-customer').style.display = t === 'customer' ? 'block' : 'none';
  $('view-merchant').style.display = t === 'merchant' ? 'block' : 'none';
  if (t === 'merchant') { if (!session) showLogin(); else renderMerchant(); }
}
function renderMerchantTabs() {
  const isBoss = session && session.role === '老板';
  const tabs = isBoss
    ? [['orders', '订单'], ['dishes', '菜品'], ['report', '报表'], ['qr', '收款码']]
    : [['orders', '订单'], ['dishes', '菜品']];
  if (!tabs.find(x => x[0] === merchantTab)) merchantTab = 'orders';
  $('mtabs').innerHTML = tabs.map(([k, label]) =>
    `<button class="${k === merchantTab ? 'active' : ''}" onclick="switchMerchant('${k}')">${label}</button>`).join('');
}
function showLogin() { $('loginMask').style.display = 'flex'; $('loginMsg').textContent = ''; }
function closeLogin() { $('loginMask').style.display = 'none'; }
async function doLogin() {
  const username = $('loginUser').value.trim();
  const password = $('loginPwd').value;
  const { error } = await auth.signInWithPassword({ username, password });
  if (error) { $('loginMsg').textContent = '登录失败：' + error.message; return; }
  const { data: sess } = await auth.getSession();
  const uidv = sess && sess.user ? sess.user.id : null;
  const { data: roleRow, error: re } = await db.from('user_roles').select('role').eq('uid', uidv).single();
  if (re || !roleRow) { $('loginMsg').textContent = '该账号未配置角色'; await auth.signOut(); return; }
  session = { role: roleRow.role, username, uid: uidv };
  closeLogin(); renderMerchant();
}
async function logout() {
  try { await auth.signOut(); } catch (e) {}
  session = null;
  try { await auth.signInAnonymously(); } catch (e) {}
  switchTab('customer');
  alert('已退出商家登录');
}
function renderMerchant() {
  renderMerchantTabs();
  if (merchantTab === 'orders') renderMOrders();
  else if (merchantTab === 'dishes') renderMDishes();
  else if (merchantTab === 'report') renderReport();
  else if (merchantTab === 'qr') renderQr();
}
function switchMerchant(t) { merchantTab = t; renderMerchant(); }

/* 订单管理 */
async function renderMOrders() {
  const box = $('merchant-body');
  box.innerHTML = '<div class="loading">加载中…</div>';
  const { data, error } = await db.from('orders').select('*').order('created_at', { ascending: false });
  if (error) { box.innerHTML = '<div class="order-msg">加载失败：' + error.message + '</div>'; return; }
  const list = data || [];
  if (!list.length) { box.innerHTML = '<div class="card muted">暂无订单</div>'; return; }
  box.innerHTML = list.map(o => {
    const paid = o.status === 'paid';
    return `<div class="card">
      <div class="o-row"><b>${o.room_name}（${o.table_no}号）</b>${paid ? '<span class="pill paid">已支付</span>' : '<span class="pill unpaid">未支付</span>'}</div>
      <div class="o-items">${(o.items || []).map(i => `${i.name} ×${i.qty}`).join('，')}</div>
      <div class="o-row"><span class="price-red">${fmt(o.total)}</span>
        ${paid ? '' : `<button class="btn" style="padding:6px 14px;" onclick="settleOrder('${o.id}')">标记支付</button>`}
      </div>
    </div>`;
  }).join('');
}
async function settleOrder(id) {
  const { error } = await db.from('orders').update({ status: 'paid', paid_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('操作失败：' + error.message); return; }
  renderMOrders();
}

/* 菜品管理 */
async function renderMDishes() {
  const box = $('merchant-body');
  const { data, error } = await db.from('dishes').select('*').order('price');
  if (error) { box.innerHTML = '<div class="order-msg">加载失败：' + error.message + '</div>'; return; }
  const list = data || [];
  box.innerHTML = `<button class="btn" style="margin-bottom:12px;" onclick="addDish()">+ 新增菜品</button>` +
    list.map(d => `<div class="card m-row">
      <img src="${d.image || 'images/mifan.svg'}" alt="${d.name}" />
      <div style="flex:1;">
        <div class="dish-name">${d.name} <span class="muted" style="font-size:12px;">${d.category}</span></div>
        <div class="price">${fmt(d.price)}</div>
      </div>
      <div class="m-actions">
        <button class="m-edit" onclick="editDish('${d.id}')">改价</button>
        <button class="m-del" onclick="deleteDish('${d.id}')">删除</button>
      </div>
    </div>`).join('');
}
function editDish(id) {
  const d = dishesCache.find(x => x.id === id) || null;
  const cur = d || { name: '', category: '热菜', price: 0, image: 'images/mifan.svg', description: '' };
  $('editModal').innerHTML = `
    <h2>编辑菜品</h2>
    <div class="form-row"><input id="edName" value="${cur.name}" placeholder="菜名" /></div>
    <div class="form-row"><select id="edCat">${CATS.map(c => `<option ${c === cur.category ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    <div class="form-row"><input id="edPrice" type="number" value="${cur.price}" placeholder="价格" /></div>
    <div class="form-row"><input id="edImg" value="${cur.image || ''}" placeholder="图片路径" /></div>
    <div class="form-row"><input id="edDesc" value="${cur.description || ''}" placeholder="描述" /></div>
    <button class="btn" style="width:100%;" onclick="saveDish('${id}')">保存</button>`;
  $('editMask').style.display = 'flex';
}
async function addDish() { editDish('__new__'); }
async function saveDish(id) {
  const payload = {
    name: $('edName').value.trim(), category: $('edCat').value,
    price: Number($('edPrice').value) || 0, image: $('edImg').value || 'images/mifan.svg',
    description: $('edDesc').value, specs: [], available: true
  };
  let error;
  if (id === '__new__') { payload.id = 'd_' + uid(); const r = await db.from('dishes').insert(payload); error = r.error; }
  else { const r = await db.from('dishes').update(payload).eq('id', id); error = r.error; }
  if (error) { alert('保存失败：' + error.message); return; }
  $('editMask').style.display = 'none';
  await loadDishes(); renderMDishes();
}
async function deleteDish(id) {
  if (!confirm('确定删除该菜品？')) return;
  const { error } = await db.from('dishes').delete().eq('id', id);
  if (error) { alert('删除失败：' + error.message); return; }
  await loadDishes(); renderMDishes();
}
function closeEdit() { $('editMask').style.display = 'none'; }

/* 报表 */
let repMode = 'day', repDate = new Date().toISOString().slice(0, 10);
async function renderReport() {
  const box = $('merchant-body');
  box.innerHTML = `
    <div class="seg">
      <button class="${repMode === 'day' ? 'on' : ''}" onclick="setRep('day')">按日</button>
      <button class="${repMode === 'period' ? 'on' : ''}" onclick="setRep('period')">按时段</button>
      <input type="date" value="${repDate}" onchange="repDate=this.value;renderReport()" />
    </div>
    <div id="repBody"><div class="loading">加载中…</div></div>`;
  const { data, error } = await db.from('orders').select('*');
  if (error) { $('repBody').innerHTML = '<div class="order-msg">加载失败：' + error.message + '</div>'; return; }
  const list = (data || []).filter(o => o.status === 'paid');
  let rows;
  if (repMode === 'day') {
    rows = list.filter(o => (o.paid_at || o.created_at).slice(0, 10) === repDate);
  } else {
    const hour = h => (h < 11 ? '早市' : h < 14 ? '午市' : h < 17 ? '下午茶' : h < 21 ? '晚市' : '夜宵');
    rows = list.filter(o => (o.paid_at || o.created_at).slice(0, 10) === repDate);
    const bySlot = {};
    rows.forEach(o => { const h = new Date(o.paid_at || o.created_at).getHours(); bySlot[hour(h)] = (bySlot[hour(h)] || 0) + o.total; });
    $('repBody').innerHTML = Object.entries(bySlot).map(([k, v]) =>
      `<div class="kpi"><div class="muted">${k}</div><div class="kpi-v">${fmt(v)}</div></div>`).join('') || '<div class="card muted">该日无已支付订单</div>';
    const total = rows.reduce((s, o) => s + o.total, 0);
    $('repBody').insertAdjacentHTML('beforeend', `<div class="kpi" style="grid-column:1/3"><div class="muted">${repDate} 合计</div><div class="kpi-v">${fmt(total)}</div></div>`);
    return;
  }
  const total = rows.reduce((s, o) => s + o.total, 0);
  const cnt = rows.length;
  $('repBody').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="muted">营业额</div><div class="kpi-v">${fmt(total)}</div></div>
      <div class="kpi"><div class="muted">订单数</div><div class="kpi-v">${cnt}</div></div>
    </div>
    ${rows.map(o => `<div class="card"><div class="o-row"><b>${o.room_name}（${o.table_no}号）</b><span class="price-red">${fmt(o.total)}</span></div><div class="muted">${new Date(o.paid_at || o.created_at).toLocaleString('zh-CN')}</div></div>`).join('') || '<div class="card muted">该日无已支付订单</div>'}`;
}
function setRep(m) { repMode = m; renderReport(); }

/* 收款码 */
async function renderQr() {
  const box = $('merchant-body');
  const { data } = await db.from('payment_qrcodes').select('*');
  const map = {}; (data || []).forEach(r => map[r.channel] = r.image_url);
  const channels = [['alipay', '支付宝收款码'], ['wechat', '微信收款码']];
  box.innerHTML = channels.map(([ch, name]) => `
    <div class="qr-card">
      <div class="qn">${name}</div>
      ${map[ch] ? `<img src="${map[ch]}" /><div class="qt">已配置</div>` : '<div class="qt">未配置</div>'}
      <div class="form-row" style="margin-top:8px;"><input id="qr_${ch}" placeholder="粘贴图片 URL" value="${map[ch] || ''}" /></div>
      <button class="btn" style="width:100%;" onclick="saveQr('${ch}')">保存</button>
    </div>`).join('');
}
async function saveQr(ch) {
  const url = $('qr_' + ch).value.trim();
  const id = 'qr_' + ch;
  const { error } = await db.from('payment_qrcodes').upsert({ id, channel: ch, image_url: url, updated_at: new Date().toISOString() });
  if (error) { alert('保存失败：' + error.message); return; }
  renderQr();
}

/* ===== 暴露给内联 onclick ===== */
Object.assign(window, {
  switchTab, switchCust, submitOrder, closeBill, openSpec, pickSpec, specQty, confirmSpec, closeSpec,
  addSimple, decDish, setCat, chooseRoom, setPeople, logout, showLogin, closeLogin, doLogin,
  switchMerchant, settleOrder, editDish, addDish, saveDish, deleteDish, closeEdit, setRep, saveQr
});

boot();
</script>
</body>
</html>
